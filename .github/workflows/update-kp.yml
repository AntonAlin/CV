name: Refresh aurora forecast

# Every three hours, copy NOAA's planetary K-index forecast into data/kp.json
# so the page can read it from its own origin. The page still tries NOAA
# directly if this file is missing or stale.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-kp
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and validate
        run: |
          mkdir -p data
          curl -sSf --max-time 60 \
            https://services.swpc.noaa.gov/products/noaa-planetary-k-index-forecast.json -o /tmp/kp.json
          python3 - <<'PY'
          import json
          rows = json.load(open("/tmp/kp.json"))
          assert isinstance(rows, list) and len(rows) > 2, type(rows)
          def cell(r, i, k): return r[i] if isinstance(r, list) else r[k]
          body = [r for r in rows if cell(r, 0, "time_tag") != "time_tag"]
          float(cell(body[0], 1, "kp"))
          print(f"{len(body)} rows, latest {cell(body[-1], 0, 'time_tag')}")
          PY
          cp /tmp/kp.json data/kp.json

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kp.json
          if git diff --staged --quiet; then
            echo "Unchanged."
          else
            git commit -m "Refresh aurora forecast [skip ci]"
            # Another workflow may have pushed meanwhile; land on top of it
            git pull --rebase --quiet
            git push
          fi
