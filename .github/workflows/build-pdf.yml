name: Build CV PDFs

# Regenerating on every push is the point: the downloadable files can never
# drift from the page they are rendered from.
on:
  push:
    branches: [main]
    # The commit this workflow makes touches only pdf/, which is not listed
    # here — so it cannot retrigger itself.
    paths:
      - index.html
      - img/**
      - tools/build-pdf.py
      - .github/workflows/build-pdf.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pdf
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --quiet playwright pymupdf
          playwright install --with-deps chromium

      - name: Render PDFs
        # Fails the build if the print sheet no longer fits two pages
        # (or one, for the short variant).
        run: python tools/build-pdf.py

      - name: Commit rebuilt PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf/
          if git diff --staged --quiet; then
            echo "PDFs unchanged."
          else
            git commit -m "Rebuild CV PDFs [skip ci]"
            git push
          fi
