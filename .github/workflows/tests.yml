name: Tests

# Runs on every branch, not just main: the point is to catch a regression
# before it reaches the page, not after.
on:
  push:
    paths:
      - index.html
      - img/**
      - tests/**
      - .github/workflows/tests.yml
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --quiet playwright pymupdf pillow opencv-python-headless
          playwright install --with-deps chromium

      - name: Screen assertions
        run: python tests/test_screen.py

      - name: Print and PDF assertions
        run: python tests/test_print.py
