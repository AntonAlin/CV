name: Refresh market strip

# Every weekday after the US close, fetch a handful of quotes and SEK
# crosses into data/markets.json for the strip in the page footer.
# Needs the repository secret ALPHAVANTAGE_KEY (five calls a run).
on:
  schedule:
    - cron: "20 21 * * 1-5"    # weekdays 21:20 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-markets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and write
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: python tools/update-markets.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/markets.json
          if git diff --staged --quiet; then
            echo "Unchanged."
          else
            git commit -m "Refresh market strip [skip ci]"
            git push
          fi
